name: Release

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
      # 不排除任何组合，全部构建

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --version

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build and compress
        shell: bash
        run: |
          BINARY="jaysenwxapkg"
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o "${BINARY}${EXT}" .

          # UPX 压缩（windows-arm64 不支持，跳过）
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "UPX 不支持 windows-arm64，跳过压缩"
          else
            upx --best --lzma "${BINARY}${EXT}" || echo "UPX 压缩失败，保留未压缩版本"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaysenwxapkg-${{ matrix.os }}-${{ matrix.arch }}
          path: jaysenwxapkg*

  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -laR

      - name: Generate checksums
        run: |
          find . -type f -name "jaysenwxapkg-*" -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jaysenwxapkg-*/*
            checksums.txt
          generate_release_notes: true
